# Hand-verified question set, 40 questions across two repositories.
#
# Every gold symbol was checked to resolve to a real indexed chunk; the check
# runs as part of the evaluation (`--validate-only`) and fails loudly if a gold
# answer drifts out of the code.
#
# Questions are typed, because the types measure different things:
#
#   lookup           the question shares vocabulary with the target. Any decent
#                    lexical retriever should get these, and a failure here is
#                    a real problem.
#   vocabulary_gap   the question deliberately avoids the identifier it is
#                    looking for, phrased the way somebody who has never read
#                    the code would ask. This is what BM25 alone cannot do and
#                    the dense arm exists for.
#   relational       the answer depends on how code connects to other code, so
#                    the graph has to carry it.
#
# Scoring a single blended number over all three would hide which component is
# doing the work, so the harness reports per-type breakdowns.

repos:
  navigator:
    root: "src"
    description: "This repository."
  campus_qsr:
    root: "../Campus-QSR/src"
    description: "A second, unrelated Python repository, to check the system is not tuned to its own source."

